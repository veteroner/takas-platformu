<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>TakaZone App Icon Generator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #1a1a2e; color: white; }
        canvas { border: 1px solid #333; margin: 10px; border-radius: 8px; }
        .size-label { margin: 10px 0; font-weight: bold; color: #9333EA; }
        h1 { background: linear-gradient(90deg, #9333EA, #7C3AED); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        a { color: #9333EA; margin-left: 10px; }
    </style>
</head>
<body>
    <h1>TakaZone App Icon Generator - 3D Cube</h1>
    <div id="icons"></div>
    
    <script>
        const sizes = [16, 32, 48, 64, 128, 180, 192, 512, 1024];
        const container = document.getElementById('icons');
        
        sizes.forEach(size => {
            const label = document.createElement('div');
            label.className = 'size-label';
            label.textContent = `${size}x${size}px`;
            container.appendChild(label);
            
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            container.appendChild(canvas);
            
            const ctx = canvas.getContext('2d');
            
            // Create gradient background
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#9333EA');
            gradient.addColorStop(1, '#7C3AED');
            
            // Draw background with rounded corners
            const radius = size * 0.2;
            ctx.beginPath();
            ctx.roundRect(0, 0, size, size, radius);
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Draw 3D Cube
            ctx.strokeStyle = 'white';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            const scale = size / 512;
            ctx.lineWidth = 16 * scale;
            
            const cx = size / 2;
            const topY = size * 0.23;
            const midY = size * 0.51;
            const botY = size * 0.78;
            const leftX = size * 0.26;
            const rightX = size * 0.74;
            
            // Üst yüzey
            ctx.beginPath();
            ctx.moveTo(cx, topY);
            ctx.lineTo(rightX, topY + (midY - topY) * 0.5);
            ctx.lineTo(cx, midY);
            ctx.lineTo(leftX, topY + (midY - topY) * 0.5);
            ctx.closePath();
            ctx.stroke();
            
            // Sol yüzey
            ctx.beginPath();
            ctx.moveTo(leftX, topY + (midY - topY) * 0.5);
            ctx.lineTo(leftX, botY - (botY - midY) * 0.3);
            ctx.lineTo(cx, botY);
            ctx.lineTo(cx, midY);
            ctx.stroke();
            
            // Sağ yüzey
            ctx.beginPath();
            ctx.moveTo(rightX, topY + (midY - topY) * 0.5);
            ctx.lineTo(rightX, botY - (botY - midY) * 0.3);
            ctx.lineTo(cx, botY);
            ctx.lineTo(cx, midY);
            ctx.stroke();
            
            // Add download link
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = `takazone-icon-${size}.png`;
            link.textContent = 'Download';
            container.appendChild(link);
            container.appendChild(document.createElement('br'));
        });
    </script>
</body>
</html>
