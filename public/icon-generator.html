<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>TakaZone App Icon Generator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #1a1a2e; color: white; }
        canvas { border: 1px solid #333; margin: 10px; border-radius: 8px; }
        .size-label { margin: 10px 0; font-weight: bold; color: #A855F7; }
        h1 { background: linear-gradient(90deg, #A855F7, #7C3AED); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        a { color: #A855F7; margin-left: 10px; }
    </style>
</head>
<body>
    <h1>TakaZone App Icon Generator - 3D Cube</h1>
    <div id="icons"></div>
    
    <script>
        const sizes = [16, 32, 48, 64, 128, 180, 192, 512, 1024];
        const container = document.getElementById('icons');
        
        sizes.forEach(size => {
            const label = document.createElement('div');
            label.className = 'size-label';
            label.textContent = `${size}x${size}px`;
            container.appendChild(label);
            
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            container.appendChild(canvas);
            
            const ctx = canvas.getContext('2d');
            
            // Create gradient background (#A855F7 → #7C3AED)
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#A855F7');
            gradient.addColorStop(1, '#7C3AED');
            
            // Draw background with rounded corners (rx=110 in 512 viewbox ≈ 21.5%)
            const radius = size * 0.215;
            const padding = size * 0.03125; // 16/512
            ctx.beginPath();
            ctx.roundRect(padding, padding, size - padding * 2, size - padding * 2, radius);
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Draw Takas/Exchange Icon
            ctx.fillStyle = 'white';
            ctx.strokeStyle = 'white';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = 4 * (size / 512);
            
            const centerX = size / 2;
            const centerY = size * 0.35; // 180/512
            
            // Üst Ok (Sağa) - M-140 -20 L60 -20 L60 -50 L110 0 L60 50 L60 20 L-140 20 Z
            ctx.beginPath();
            ctx.moveTo(centerX - 140 * (size/512), centerY - 20 * (size/512));
            ctx.lineTo(centerX + 60 * (size/512), centerY - 20 * (size/512));
            ctx.lineTo(centerX + 60 * (size/512), centerY - 50 * (size/512));
            ctx.lineTo(centerX + 110 * (size/512), centerY);
            ctx.lineTo(centerX + 60 * (size/512), centerY + 50 * (size/512));
            ctx.lineTo(centerX + 60 * (size/512), centerY + 20 * (size/512));
            ctx.lineTo(centerX - 140 * (size/512), centerY + 20 * (size/512));
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            // Alt Ok (Sola) - M140 70 L-60 70 L-60 100 L-110 50 L-60 0 L-60 30 L140 30 Z
            ctx.beginPath();
            ctx.moveTo(centerX + 140 * (size/512), centerY + 70 * (size/512));
            ctx.lineTo(centerX - 60 * (size/512), centerY + 70 * (size/512));
            ctx.lineTo(centerX - 60 * (size/512), centerY + 100 * (size/512));
            ctx.lineTo(centerX - 110 * (size/512), centerY + 50 * (size/512));
            ctx.lineTo(centerX - 60 * (size/512), centerY);
            ctx.lineTo(centerX - 60 * (size/512), centerY + 30 * (size/512));
            ctx.lineTo(centerX + 140 * (size/512), centerY + 30 * (size/512));
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            // Draw TakaZone text
            ctx.fillStyle = 'white';
            ctx.font = `bold ${size * 0.14}px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('TakaZone', size / 2, size * 0.82);
            
            // Add download link
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = `takazone-icon-${size}.png`;
            link.textContent = 'Download';
            container.appendChild(link);
            container.appendChild(document.createElement('br'));
        });
    </script>
</body>
</html>
