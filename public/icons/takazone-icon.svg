<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#grad)"/>

  <!-- Takas/Exchange Icon -->
  <g transform="translate(256, 180)">
    <!-- Üst Ok (Sağa) -->
    <path d="M-140 -20 L60 -20 L60 -50 L110 0 L60 50 L60 20 L-140 20 Z" 
          fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Alt Ok (Sola) -->
    <path d="M140 70 L-60 70 L-60 100 L-110 50 L-60 0 L-60 30 L140 30 Z" 
          fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- TakaZone Text -->
  <text x="256" y="420" 
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" 
        font-size="72" 
        font-weight="700" 
        fill="#ffffff" 
        text-anchor="middle">TakaZone</text>
</svg>
