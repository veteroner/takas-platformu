<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient tanımları -->
  <defs>
    <linearGradient id="appGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Arka plan yuvarlak köşeli kare -->
  <rect width="512" height="512" rx="110" fill="url(#appGradient)"/>
  
  <!-- İç parlak efekt -->
  <ellipse cx="256" cy="180" rx="180" ry="120" fill="white" opacity="0.08"/>
  
  <!-- TakaZone - "TZ" harfleri stilize -->
  <g filter="url(#shadow)">
    <!-- T harfi -->
    <path d="M 120 160 L 240 160" stroke="white" stroke-width="36" stroke-linecap="round"/>
    <path d="M 180 160 L 180 280" stroke="white" stroke-width="36" stroke-linecap="round"/>
    
    <!-- Z harfi (takas okları şeklinde) -->
    <path d="M 272 160 L 392 160 L 272 280 L 392 280" stroke="white" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Takas ok işaretleri -->
    <path d="M 365 160 L 392 160 L 378 145" stroke="white" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 299 280 L 272 280 L 286 295" stroke="white" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- Alt kısımda "one" yazısı (opsiyonel küçük) -->
  <text x="256" y="380" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" opacity="0.9" text-anchor="middle">
    ZONE
  </text>
  
  <!-- Dekoratif noktalar -->
  <circle cx="140" cy="350" r="8" fill="white" opacity="0.4"/>
  <circle cx="372" cy="350" r="8" fill="white" opacity="0.4"/>
</svg>
