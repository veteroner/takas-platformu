<svg width="2732" height="2732" viewBox="0 0 2732 2732" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <rect width="2732" height="2732" fill="url(#splashGradient)"/>
  
  <!-- Main Icon - 3D Cube Centered -->
  <g transform="translate(1366, 1200)">
    <!-- Cube Icon scaled up -->
    <g transform="translate(-200,-150) scale(2.5)" stroke="#ffffff" stroke-width="28" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <!-- top -->
      <path d="M160 80 L240 120 L160 160 L80 120 Z"/>
      <!-- left -->
      <path d="M80 120 L80 200 L160 240 L160 160 Z"/>
      <!-- right -->
      <path d="M240 120 L240 200 L160 240 L160 160 Z"/>
    </g>
  </g>

  <!-- TakaZone Text -->
  <text x="50%" y="1580" text-anchor="middle" font-size="200" fill="white" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700" letter-spacing="4">TakaZone</text>
  <text x="50%" y="1680" text-anchor="middle" font-size="80" fill="white" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" opacity="0.9">Takas Et, Yeni Şeyler Keşfet.</text>
  
  <defs>
    <linearGradient id="splashGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A855F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
