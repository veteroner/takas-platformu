<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- TakaZone App Icon -->
  <defs>
    <linearGradient id="appGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Arka plan -->
  <rect width="512" height="512" rx="110" fill="url(#appGradient)"/>
  
  <!-- İç parlak efekt -->
  <ellipse cx="256" cy="180" rx="180" ry="120" fill="white" opacity="0.08"/>
  
  <!-- TZ Logo (TakaZone) -->
  <g filter="url(#glow)">
    <!-- T harfi -->
    <path d="M 130 170 L 230 170" stroke="white" stroke-width="32" stroke-linecap="round"/>
    <path d="M 180 170 L 180 280" stroke="white" stroke-width="32" stroke-linecap="round"/>
    
    <!-- Z harfi (takas okları ile) -->
    <path d="M 270 170 L 380 170 L 270 280 L 380 280" stroke="white" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Z üzerinde ok uçları -->
    <path d="M 355 170 L 380 170 L 368 155" stroke="white" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 295 280 L 270 280 L 282 295" stroke="white" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- ZONE yazısı -->
  <text x="256" y="370" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="bold" fill="white" opacity="0.95" text-anchor="middle" letter-spacing="8">
    ZONE
  </text>
</svg>
</svg>
