<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="600" viewBox="0 0 1400 600" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Icon background -->
  <rect x="80" y="80" width="440" height="440" rx="120" fill="url(#grad)"/>

  <!-- Takas/Exchange Icon -->
  <g transform="translate(300, 220)">
    <!-- Üst Ok (Sağa) -->
    <path d="M-100 -15 L40 -15 L40 -35 L75 0 L40 35 L40 15 L-100 15 Z" 
          fill="#ffffff" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Alt Ok (Sola) -->
    <path d="M100 50 L-40 50 L-40 70 L-75 35 L-40 0 L-40 20 L100 20 Z" 
          fill="#ffffff" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Brand Name -->
  <text x="580" y="300"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial"
        font-size="150"
        font-weight="700"
        fill="#6D28D9">
    TakaZone
  </text>

  <!-- Tagline -->
  <text x="580" y="390"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial"
        font-size="48"
        font-weight="400"
        fill="#7C3AED">
    Takas Et, Yeni Şeyler Keşfet.
  </text>

</svg>
