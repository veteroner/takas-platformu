<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>TakaZone App Icon Generator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #1a1a2e; color: white; }
        canvas { border: 1px solid #333; margin: 10px; border-radius: 8px; }
        .size-label { margin: 10px 0; font-weight: bold; color: #A855F7; }
        h1 { background: linear-gradient(90deg, #A855F7, #7C3AED); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        a { color: #A855F7; margin-left: 10px; }
    </style>
</head>
<body>
    <h1>TakaZone App Icon Generator - 3D Cube</h1>
    <div id="icons"></div>
    
    <script>
        const sizes = [16, 32, 48, 64, 128, 180, 192, 512, 1024];
        const container = document.getElementById('icons');
        
        sizes.forEach(size => {
            const label = document.createElement('div');
            label.className = 'size-label';
            label.textContent = `${size}x${size}px`;
            container.appendChild(label);
            
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            container.appendChild(canvas);
            
            const ctx = canvas.getContext('2d');
            
            // Create gradient background (#A855F7 → #7C3AED)
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#A855F7');
            gradient.addColorStop(1, '#7C3AED');
            
            // Draw background with rounded corners (rx=110 in 512 viewbox ≈ 21.5%)
            const radius = size * 0.215;
            const padding = size * 0.03125; // 16/512
            ctx.beginPath();
            ctx.roundRect(padding, padding, size - padding * 2, size - padding * 2, radius);
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Draw 3D Cube - exact design from new SVG
            // ViewBox is 512, cube transform: translate(56,56) scale(0.78)
            ctx.strokeStyle = 'white';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = (28 * 0.78 / 512) * size; // stroke-width="28" scaled
            
            function transformX(x) {
                return (x * 0.78 + 56) / 512 * size;
            }
            function transformY(y) {
                return (y * 0.78 + 56) / 512 * size;
            }
            
            // Top face: M256 128 L384 192 L256 256 L128 192 Z
            ctx.beginPath();
            ctx.moveTo(transformX(256), transformY(128));
            ctx.lineTo(transformX(384), transformY(192));
            ctx.lineTo(transformX(256), transformY(256));
            ctx.lineTo(transformX(128), transformY(192));
            ctx.closePath();
            ctx.stroke();
            
            // Left face: M128 192 L128 320 L256 384 L256 256 Z
            ctx.beginPath();
            ctx.moveTo(transformX(128), transformY(192));
            ctx.lineTo(transformX(128), transformY(320));
            ctx.lineTo(transformX(256), transformY(384));
            ctx.lineTo(transformX(256), transformY(256));
            ctx.closePath();
            ctx.stroke();
            
            // Right face: M384 192 L384 320 L256 384 L256 256 Z
            ctx.beginPath();
            ctx.moveTo(transformX(384), transformY(192));
            ctx.lineTo(transformX(384), transformY(320));
            ctx.lineTo(transformX(256), transformY(384));
            ctx.lineTo(transformX(256), transformY(256));
            ctx.closePath();
            ctx.stroke();
            
            // Add download link
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = `takazone-icon-${size}.png`;
            link.textContent = 'Download';
            container.appendChild(link);
            container.appendChild(document.createElement('br'));
        });
    </script>
</body>
</html>
