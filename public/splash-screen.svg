<svg width="1242" height="2688" viewBox="0 0 1242 2688" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1242" height="2688" fill="url(#splashGradient)"/>
  
  <!-- Main Logo (perfectly centered horizontally, slightly above optical center vertically) -->
  <g transform="translate(621, 1250)">
    <!-- Soft glow -->
    <circle cx="0" cy="0" r="140" fill="white" opacity="0.12"/>
    <circle cx="0" cy="0" r="110" fill="white" opacity="0.18"/>

    <!-- Symmetric exchange icon set -->
    <!-- Left circle -->
    <circle cx="-64" cy="0" r="46" fill="white" opacity="0.95"/>
    <!-- Left arrow (pointing right-up) -->
    <path d="M-84 0 L-44 -30 L-44 -15 L-24 -15 L-24 15 L-44 15 L-44 30 Z" fill="#6366F1"/>

    <!-- Right circle -->
    <circle cx="64" cy="0" r="46" fill="white" opacity="0.95"/>
    <!-- Right arrow (pointing left-down) -->
    <path d="M84 0 L44 30 L44 15 L24 15 L24 -15 L44 -15 L44 -30 Z" fill="#EC4899"/>

    <!-- Center diamond -->
    <circle cx="0" cy="0" r="28" fill="white"/>
    <path d="M-18 0 L0 -18 L18 0 L0 18 Z" fill="#8B5CF6"/>
  </g>

  <!-- Title and tagline (centered) -->
  <text x="50%" y="1550" text-anchor="middle" font-size="72" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="800" letter-spacing="2">TAKAS</text>
  <text x="50%" y="1625" text-anchor="middle" font-size="30" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" opacity="0.9">Eşyalarını Takas Et</text>
  
  <defs>
    <linearGradient id="splashGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
