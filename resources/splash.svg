<svg width="2732" height="2732" viewBox="0 0 2732 2732" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  
  <rect width="2732" height="2732" fill="url(#bg)"/>
  
  <!-- İkon Container -->
  <g transform="translate(1366, 1166)">
    <rect x="-200" y="-200" width="400" height="400" rx="84" fill="white" opacity="0.15"/>
    
    <!-- İki ok işareti -->
    <g transform="translate(0, 0)">
      <!-- Üst ok (sağa) -->
      <g transform="translate(0, -40)">
        <line x1="-80" y1="0" x2="56" y2="0" stroke="white" stroke-width="28" stroke-linecap="round"/>
        <polyline points="32,-28 68,0 32,28" stroke="white" stroke-width="28" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      
      <!-- Alt ok (sola) -->
      <g transform="translate(0, 40)">
        <line x1="80" y1="0" x2="-56" y2="0" stroke="white" stroke-width="28" stroke-linecap="round"/>
        <polyline points="-32,28 -68,0 -32,-28" stroke="white" stroke-width="28" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
  
  <!-- TakaZone Yazısı -->
  <text x="1366" y="1650" font-family="Inter, -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif" 
        font-size="160" font-weight="700" fill="white" text-anchor="middle">TakaZone</text>
  
  <!-- Alt Yazı -->
  <text x="1366" y="1780" font-family="Inter, -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif" 
        font-size="60" font-weight="400" fill="white" fill-opacity="0.8" text-anchor="middle">Takas Platformu</text>
</svg>
