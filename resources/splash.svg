<svg width="2732" height="2732" viewBox="0 0 2732 2732" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <rect width="2732" height="2732" fill="url(#splashGradient)"/>
  
  <!-- Main Icon - Centered Block -->
  <g transform="translate(1366, 1270)">
    <!-- Soft glow -->
  <circle cx="0" cy="0" r="240" fill="white" opacity="0.10"/>
  <circle cx="0" cy="0" r="190" fill="white" opacity="0.16"/>

    <!-- Left circle -->
    <circle cx="-160" cy="0" r="120" fill="white" opacity="0.95"/>
    <path d="M-200 0 L-120 -80 L-120 -40 L-80 -40 L-80 40 L-120 40 L-120 80 Z" fill="#6366F1"/>

    <!-- Right circle -->
    <circle cx="160" cy="0" r="120" fill="white" opacity="0.95"/>
    <path d="M200 0 L120 80 L120 40 L80 40 L80 -40 L120 -40 L120 -80 Z" fill="#EC4899"/>

    <!-- Center diamond -->
    <circle cx="0" cy="0" r="70" fill="white"/>
    <path d="M-48 0 L0 -48 L48 0 L0 48 Z" fill="#8B5CF6"/>
  </g>

  <!-- Centered Text -->
  <text x="50%" y="1560" text-anchor="middle" font-size="180" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="800" letter-spacing="6">TAKAS</text>
  <text x="50%" y="1635" text-anchor="middle" font-size="80" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" opacity="0.9">Eşyalarını Takas Et</text>
  
  <defs>
    <linearGradient id="splashGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
